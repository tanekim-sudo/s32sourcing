# Deploy API + Postgres on Render: https://dashboard.render.com → New → Blueprint
# Then set NEXT_PUBLIC_API_URL on Vercel to https://<api-service>.onrender.com

databases:
  - name: s32sourcing-db
    plan: free
    databaseName: s32sourcing
    user: s32

services:
  - type: web
    name: s32sourcing-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: s32sourcing-db
          property: connectionString
      - key: AUTH_DEV_BYPASS
        value: "true"
      - key: AUTH_DEV_PARTNER_EMAIL
        value: dev@s32.com
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL(s), comma-separated
      - key: EXA_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SPECTER_API_KEY
        sync: false
      - key: AFFINITY_API_KEY
        sync: false
      - key: CLAY_API_KEY
        sync: false
